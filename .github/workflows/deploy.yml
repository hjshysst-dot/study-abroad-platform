name: Deploy Demo

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install server dependencies
        run: |
          cd server
          npm install
          
      - name: Install client dependencies
        run: |
          cd client
          npm install
          npm run build
          
      - name: Start server
        run: |
          cd server
          node index.js &
          sleep 3
          
      - name: Verify server
        run: |
          curl -s http://localhost:3001/api/health || echo "Server check completed"
          
  demo:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment
        run: |
          echo "Demo server running at http://localhost:3001"
          echo "GitHub Codespaces 需要在网页端创建"
